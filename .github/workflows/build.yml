name: Build IPA

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '26.3'
          - runner: macos-26
            xcode: '26.6'
          - runner: macos-26
            xcode: '26.4.1'
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.runner }}, Xcode ${{ matrix.xcode }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build
        # Xcode sometimes crashes while resolving the package graph; retry.
        run: |
          for attempt in 1 2 3; do
            make iphoneos && exit 0
            echo "Build attempt $attempt failed, retrying..."
          done
          exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ matrix.runner }}-xcode-${{ matrix.xcode }}
          path: packages/*.ipa
          if-no-files-found: error
