name: Build IPA

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.0.app

      - name: Build
        run: make iphoneos

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: packages/*.ipa
          if-no-files-found: error
