name: Build IPA

on:
  push:
    branches: [main, 'devin/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build
        # Xcode 26.3 on macos-26 crashes resolving packages; 26.6 works. Retry for flakiness.
        run: |
          for attempt in 1 2 3; do
            make iphoneos && exit 0
            echo "Build attempt $attempt failed, retrying..."
          done
          exit 1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: packages/*.ipa
          if-no-files-found: error
